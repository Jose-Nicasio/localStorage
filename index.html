<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Mejor Innovación Textil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="saltarLoginSiAutenticado()" class="container mt-5">
    <h3>Sistema de Votación - Iniciar Sesión</h3>
    <form onsubmit="iniciarSesion(event)" class="mt-3" style="max-width: 400px;">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="inputUser" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="inputPass" class="form-control" required>
        </div>
        <div id="errorMsg" class="alert alert-danger d-none">Usuario o contraseña incorrectos.</div>
        <button type="submit" class="btn btn-dark">Entrar</button>
    </form>
    <script src="js/app.js"></script>
</body>
</html>
