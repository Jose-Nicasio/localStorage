<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Jurado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="verificarAcceso('Jurado'); renderizarPanelJurado();" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3>Panel de Jurado - Resultados en Tiempo Real</h3>
            <span id="infoUsuario" class="text-muted"></span>
        </div>
        <div>
            <span class="me-2">Estado: <strong id="badgeEstado"></strong></span>
            <button id="btnCerrarVotacion" onclick="cerrarVotacion()" class="btn btn-warning btn-sm me-2">Cerrar votación</button>
            <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
        </div>
    </div>

    <p>Total de votos emitidos: <strong id="totalVotos">0</strong></p>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Innovación</th>
                <th>Descripción</th>
                <th>Votos</th>
            </tr>
        </thead>
        <tbody id="tablaResultados"></tbody>
    </table>

    <script src="js/app.js"></script>
</body>
</html>
